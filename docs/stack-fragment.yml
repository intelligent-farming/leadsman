#
# Service definition to add to intelligent-farming-stack/docker-compose.yml.
#
# Paste the `leadsman` service into that file's `services:` block and add the two
# LEADSMAN_* variables to its .env. Leadsman reads the ChirpStack event_* tables in
# events-postgres and writes its alerts to the leadsman schema in the same database
# — no new Postgres instance, no new port, nothing published to the host.
#
# ── one-time setup ────────────────────────────────────────────────────────────
#
# 1. Create the engine role. Copy this repo's migrations/010_leadsman_role.sh into
#    the stack's postgresql/events-initdb/ so fresh volumes get it automatically,
#    then apply it to the existing volume:
#
#      docker compose exec events-postgres \
#        bash /docker-entrypoint-initdb.d/010_leadsman_role.sh
#
#    with these added to the stack's .env (and to events-postgres' environment:):
#      POSTGRES_LEADSMAN_USER=leadsman
#      POSTGRES_LEADSMAN_PASSWORD=<generate one>
#
# 2. Create the leadsman schema (runs as the owner role):
#
#      docker compose run --rm leadsman migrate
#
# 3. Index the event_* tables. ChirpStack ships them with a primary-key index only,
#    and every check filters by time and groups by dev_eui — without indexes each
#    sounding is a sequential scan, which is how a monitor starts degrading the
#    thing it monitors. Opt in explicitly since it alters ChirpStack-owned tables:
#
#      docker compose run --rm -e LEADSMAN_APPLY_EVENT_INDEXES=true leadsman migrate
#
# 4. Copy config/leadsman.example.json to the stack as config/leadsman.json, pick
#    your checks, then:
#
#      docker compose run --rm leadsman verify
#      docker compose up -d leadsman
#
# ── gateway checks and the host address ───────────────────────────────────────
#
# The `shared:/shared:ro` mount below is what enables gateway-deaf, gateway-never-seen
# and host-address-changed. It needs nothing new from the stack: the provisioner already
# writes /shared/config.json on every start with `chirpStackUrl`, `apiKey`, `tenantId`
# and `gatewayBridgeHost`, and leftenant and mock-sensors already read the same file.
#
#   - LEADSMAN_CHIRPSTACK_CONFIG points at it for the gateway API. rx_info shows which
#     gateways ARE forwarding; it cannot show one that is connected but hearing nothing,
#     or one registered and never heard from, because both are simply absent from the
#     telemetry. Those need the network server's registry.
#   - `gatewayBridgeHost` is the host LAN address setup.sh detects and hands to gateways.
#     Comparing it against the previous sounding's value is how a DHCP change after a
#     power cut is reported as a cause rather than inferred from silence.
#
# The API key is read only from that file, never from the Leadsman config, so
# config/leadsman.json stays committable. Without the mount, those three checks report
# `skipped` in leadsman.run rather than quietly finding nothing.
#
# Caveat worth knowing: the file is refreshed when the stack is brought up through
# setup.sh. A bare `docker compose up` can leave a stale gatewayBridgeHost, in which case
# host-address-changed compares two stale values and stays quiet — it under-reports
# rather than raising a false alarm.
#
# ── heartbeat ─────────────────────────────────────────────────────────────────
#
# Set LEADSMAN_HEARTBEAT_URL to have the engine POST a liveness ping after every
# sounding. This is the only signal that survives the edge device being off: while the
# host is down Leadsman is down, so nothing inside the stack can report the outage, and
# a six-hour power cut produces no alerts at all. Point it somewhere the outage cannot
# reach — a hosted ping receiver, or a Hermes route on different hardware. A watchdog on
# this same box dies with it.
#
# `host-restarted` reports the same outage retrospectively, from the event store's
# postmaster start time versus the last recorded sounding. The two are complements.
#
#   docker compose run --rm leadsman test-notify --to heartbeat
#
# ── notification ──────────────────────────────────────────────────────────────
#
# Set notify.destinations in the config: a messaging platform (twilio/telegram/signal/slack)
# for alerts a person should read, or a webhook for a Hermes route. Route `fact` alerts
# to the messaging destination and `situation` alerts to an agent route — for routine
# threshold alerts a Hermes route with `deliver_only: true` costs zero LLM tokens.
#
# Set LEADSMAN_INSTANCE_NAME per host when more than one edge device reports into the
# same channel — every message leads "Alert from <name>: ", and an unnamed install
# reports as "Alert from Leadsman".

  leadsman:
    # Swap `build:` for `image:` once this is published to a registry.
    build: https://github.com/intelligent-farming/leadsman.git
    restart: unless-stopped
    environment:
      # Engine role: SELECT on public (read ChirpStack events), INSERT/UPDATE on the
      # leadsman schema (write its own alerts). It cannot alter ChirpStack's data.
      LEADSMAN_DATABASE_URL: >-
        postgres://${POSTGRES_LEADSMAN_USER:-leadsman}:${POSTGRES_LEADSMAN_PASSWORD}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      # Owner role, used only by `migrate` — DDL is deliberately outside the
      # engine role's rights.
      LEADSMAN_MIGRATE_URL: >-
        postgres://${EVENTS_POSTGRES_USER:-events}:${EVENTS_POSTGRES_PASSWORD:-changeme}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      LEADSMAN_CONFIG: /etc/leadsman/leadsman.json
      # Names this edge device in every alert it delivers, defaulting to "Leadsman".
      # Leave unset for a single-site install; set it once two devices share a channel.
      LEADSMAN_INSTANCE_NAME: ${LEADSMAN_INSTANCE_NAME:-}
      LEADSMAN_LOG_LEVEL: ${LEADSMAN_LOG_LEVEL:-info}
      LEADSMAN_LOG_FORMAT: json
      LEADSMAN_WEBHOOK_TOKEN: ${LEADSMAN_WEBHOOK_TOKEN:-}
      # Gateway API + host address, both from the provisioner's shared config file.
      # Comment out to run without the gateway checks; they skip cleanly.
      LEADSMAN_CHIRPSTACK_CONFIG: /shared/config.json
      # Liveness ping. Unset means no heartbeat — see the note above for why an
      # outage-proof receiver has to live off this box.
      LEADSMAN_HEARTBEAT_URL: ${LEADSMAN_HEARTBEAT_URL:-}
    volumes:
      - ./config:/etc/leadsman:ro
      # Read-only: chirpStackUrl + apiKey + tenantId + gatewayBridgeHost, written by
      # the provisioner on every start. Same mount leftenant and mock-sensors use.
      - shared:/shared:ro
    depends_on:
      events-postgres:
        condition: service_healthy
      # Wait for ChirpStack to have created event_up, so the first sounding does not
      # fail against a schema that does not exist yet. Reuses the stack's own gate.
      events-schema-wait:
        condition: service_completed_successfully
    # Resource ceiling. On a 2-core edge device the engine must not be able to
    # crowd out ChirpStack's ingestion; soundings are not latency-critical.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
