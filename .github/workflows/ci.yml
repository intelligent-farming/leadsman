name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Support floor is engines.node ">=18"; cover the current LTS lines too.
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No package-lock.json is committed, so `npm ci` and setup-node's npm cache
      # (both of which require a lockfile) are not used. `npm install` resolves
      # fresh on every run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

  integration:
    name: Integration (real Postgres)
    runs-on: ubuntu-latest
    # The smoke suite covers config and rule-contract logic without a database.
    # This job is what actually validates the SQL: migrations apply, the partial
    # unique index behaves, and every check's query runs against a ChirpStack-shaped
    # event_up. A check whose SQL is subtly wrong passes unit tests and fails here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chirpstack_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events -d chirpstack_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEADSMAN_DATABASE_URL: postgres://events:test@127.0.0.1:5432/chirpstack_events
      LEADSMAN_MIGRATE_URL: postgres://events:test@127.0.0.1:5432/chirpstack_events
      LEADSMAN_CONFIG: test/fixtures/integration.json
      LEADSMAN_LOG_FORMAT: text
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Seed a ChirpStack-shaped event store
        run: psql "$LEADSMAN_DATABASE_URL" -q -f test/fixtures/seed.sql

      - name: Apply migrations
        run: |
          node dist/cli.js migrate
          LEADSMAN_APPLY_EVENT_INDEXES=true node dist/cli.js migrate

      # Unit-level coverage of the SQL: the multi-path resolvers, the device-scope
      # filter, the reconciler, and the notifier. These build the smallest event store
      # that can distinguish each behaviour, so a failure names the mechanism rather
      # than a farm scenario — and they cover things the big fixtures cannot, such as
      # candidate-path priority when a device reports two of them.
      - name: Resolver and engine tests
        env:
          LEADSMAN_TEST_DATABASE_URL: postgres://events:test@127.0.0.1:5432/chirpstack_events
        run: node --test --test-reporter=spec test/resolver.js test/engine.js

      - name: Verify config and schema
        run: node dist/cli.js verify

      - name: Sounding raises the expected alerts
        run: node dist/cli.js run

      - name: Assert the alert lifecycle
        run: node test/integration.js

      # The shipped per-device config is documentation as much as configuration, and
      # stale documentation is worse than none. Re-run it against payload shapes taken
      # from each Makerfabs codec's vectors.json so a vocabulary change breaks CI
      # rather than a farm.
      - name: Reset the event store for the per-device fixture
        run: psql "$LEADSMAN_DATABASE_URL" -q -f test/fixtures/makerfabs-seed.sql

      - name: Clear alert state between fixtures
        run: psql "$LEADSMAN_DATABASE_URL" -q -c "TRUNCATE leadsman.alert, leadsman.run;"

      - name: Makerfabs AgroSense config raises the expected alerts
        env:
          LEADSMAN_CONFIG: config/makerfabs-agrosense.example.json
        run: |
          node dist/cli.js verify
          node dist/cli.js run
          node test/makerfabs.js

  # ── publish the container image to GHCR ──────────────────────────────────────
  #
  # `needs: [test, integration]` is the point of putting this in the same workflow
  # rather than a separate one: no image is ever published unless the full suite —
  # including the Postgres job that actually validates the check SQL — passed on this
  # exact commit. A workflow_run trigger would decouple them and could ship an image
  # built from a commit whose tests failed.
  #
  # This is also the only thing that produces dist/ now that build output is no longer
  # committed, so the smoke step below is load-bearing: it proves the image can run its
  # own CLI rather than merely that the layers assembled.
  #
  # Tagging:
  #   push to main  → :main, :sha-<short>   (bleeding edge; set LEADSMAN_IMAGE to test)
  #   tag v1.2.3    → :1.2.3, :1.2, :latest (what intelligent-farming-stack pins)
  #
  # ⚠ One-time manual step: GHCR packages are PRIVATE by default even for a public
  # repo, so the first publish will not be pullable by anyone else. After the first
  # successful run, open the package page and set its visibility to public, or the
  # stack's `docker pull` fails for everyone but you.
  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      # Lets the build attach a signed provenance attestation, so a consumer can verify
      # which workflow and commit produced the image.
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        # Needed for the arm64 leg. Leadsman is pure JS on node:22-alpine (pg has no
        # native dependency), so cross-building is just slow, not fragile — and arm64
        # matters for Apple Silicon and Pi-class edge hardware.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to manage: the workflow token can write packages for this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=leadsman
            org.opencontainers.image.description=Scheduled rule engine over a ChirpStack event store
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=Intelligent Farming Foundation

      # Single-arch first, loaded into the local daemon so it can actually be run.
      # A multi-platform build cannot be `load`ed, hence two steps — the second is
      # nearly free because it reuses this build's cache.
      - name: Build amd64 image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: leadsman:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Proves the entrypoint, tini, the non-root user, and the in-image `npm run
        # build` all work. `list` and `help` need no database, so this stays hermetic.
        # Without dist/ in git, a broken build step would otherwise ship silently.
        run: |
          set -euo pipefail
          docker run --rm leadsman:smoke help | grep -q 'Usage: leadsman'
          docker run --rm leadsman:smoke list | grep -q 'checks available'
          # Every check must be present in the image, not just on a developer's machine.
          count=$(docker run --rm leadsman:smoke list --json | node -e \
            'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).length))')
          echo "checks in image: $count"
          test "$count" -ge 18
          # Migrations are copied into the runtime stage and the CLI must find them.
          docker run --rm leadsman:smoke migrate 2>&1 | grep -qi 'LEADSMAN_MIGRATE_URL' \
            || { echo "migrate did not reach its config check"; exit 1; }
          # Confirm it does not run as root.
          test "$(docker run --rm --entrypoint id leadsman:smoke -un)" = "node"

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pin in intelligent-farming-stack with:"
            echo '```yaml'
            echo "    image: ${{ env.IMAGE }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
